<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Name draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bar:       #1e1e1e;
    --surface:   #1e1e1e;
    --panel:     #1b1b1b;
    --line:      rgba(255,255,255,.14);
    --line-soft: rgba(255,255,255,.08);
    --text:      #ffffff;
    --dim:       rgba(255,255,255,.68);
    --faint:     rgba(255,255,255,.42);
    --blue:      #2f6fe4;
    --blue-hi:   #4b85ee;
    --blue-soft: #7ea5ef;
    --fab:       #2962ff;
    --amber:     #e9b83c;
    --pw:        clamp(316px, 26vw, 430px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    color: var(--text);
    font-family: Roboto, system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(120% 95% at 10% -12%, #1e2d59 0%, rgba(30,45,89,0) 58%),
      radial-gradient(115% 95% at 93% -8%,  #58212b 0%, rgba(88,33,43,0) 56%),
      #0b0b0f;
  }

  button { font: inherit; color: inherit; }
  .icon { width: 22px; height: 22px; flex: none; display: block; }

  /* ---------------- app bar ---------------- */
  .appbar {
    flex: none;
    height: 56px;
    background: var(--bar);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
    z-index: 6;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin: 0;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: .1px;
    white-space: nowrap;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: default;
  }
  .brand svg { width: 32px; height: 32px; flex: none; }

  .appbar .grow { flex: 1; }

  .navlist { display: flex; align-items: center; gap: 2px; }

  .navbtn {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
  }
  .navbtn:hover { background: rgba(255,255,255,.1); }
  .navbtn:focus-visible { outline: 2px solid var(--blue-hi); outline-offset: -2px; }
  .navbtn .icon { opacity: .92; }

  /* ---------------- main split ---------------- */
  main {
    flex: 1;
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--pw);
    min-height: 0;
    transition: grid-template-columns .22s ease;
  }
  main.collapsed { grid-template-columns: minmax(0, 1fr) 0px; }

  /* ---------------- wheel ---------------- */
  .stage-wrap {
    position: relative;
    display: grid;
    place-items: center;
    padding: 18px;
    min-width: 0;
    min-height: 0;
  }

  .fab {
    position: absolute;
    top: 18px;
    left: 18px;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: var(--fab);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.5);
    z-index: 3;
  }
  .fab:hover { background: #3d72ff; }
  .fab:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .stage {
    position: relative;
    width: min(100%, calc(100dvh - 118px));
    aspect-ratio: 1;
  }
  canvas#wheel {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
    touch-action: manipulation;
  }
  canvas#wheel.busy { cursor: default; }

  .pointer {
    position: absolute;
    top: 50%;
    right: -1.5%;
    width: clamp(42px, 8%, 74px);
    aspect-ratio: 1.05;
    transform: translateY(-50%);
    background: linear-gradient(158deg, #fdfdfd 0%, #e9e9ea 44%, #a9aaae 100%);
    clip-path: polygon(0 50%, 100% 3%, 100% 97%);
    filter: drop-shadow(-3px 5px 5px rgba(0,0,0,.6));
    z-index: 2;
  }

  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 20%;
    aspect-ratio: 1;
    border: none;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    z-index: 3;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .hub:focus-visible { outline: 3px solid var(--blue-hi); outline-offset: 4px; }
  .hub[disabled] { cursor: default; }

  .navbtn.icon-only { padding: 9px; }
  .caret { width: 17px; height: 17px; opacity: .9; flex: none; }

  .menu {
    position: absolute;
    top: 52px;
    background: #2a2a2a;
    border-radius: 4px;
    box-shadow: 0 6px 20px rgba(0,0,0,.6);
    padding: 6px 0;
    min-width: 210px;
    z-index: 9;
  }
  .menu[hidden] { display: none; }
  .menu-item {
    all: unset;
    display: block;
    width: 100%;
    box-sizing: border-box;
    cursor: pointer;
    padding: 11px 18px;
    font-size: 14.5px;
    color: #fff;
  }
  .menu-item:hover { background: rgba(255,255,255,.1); }
  .menu-item:focus-visible { outline: 2px solid var(--blue-hi); outline-offset: -2px; }

  .split-caret {
    display: inline-flex;
    align-items: center;
    margin-left: 6px;
    padding-left: 6px;
    border-left: 1px solid rgba(255,255,255,.4);
  }

  .check {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 14.5px;
    color: var(--text);
    cursor: pointer;
    flex: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .check input { position: absolute; opacity: 0; width: 0; height: 0; }
  .check .box {
    width: 19px;
    height: 19px;
    border: 2px solid rgba(255,255,255,.72);
    border-radius: 2px;
    display: grid;
    place-items: center;
  }
  .check .box svg { width: 15px; height: 15px; opacity: 0; }
  .check input:checked + .box { background: var(--blue); border-color: var(--blue); }
  .check input:checked + .box svg { opacity: 1; }
  .check input:focus-visible + .box { outline: 2px solid var(--blue-hi); outline-offset: 2px; }

  .addwheel { flex: none; display: flex; }
  .addwheel .btn { padding: 12px 18px; font-size: 15px; }

  .panel-foot .link {
    all: unset;
    color: var(--blue-soft);
    text-decoration: underline;
    cursor: pointer;
    white-space: nowrap;
    flex: none;
  }
  .panel-foot .link:hover { color: #a8c3f6; }
  .panel-foot .link:focus-visible { outline: 2px solid var(--blue-hi); outline-offset: 2px; }
  .panel-foot #footLeft { overflow: hidden; text-overflow: ellipsis; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------------- side panel ---------------- */
  .panel-toggle {
    position: absolute;
    top: 18px;
    right: calc(var(--pw) - 19px);
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: var(--fab);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(0,0,0,.5);
    z-index: 5;
    transition: right .22s ease;
  }
  .panel-toggle:hover { background: #3d72ff; }
  .panel-toggle:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .panel-toggle svg { transition: transform .22s ease; }
  main.collapsed .panel-toggle { right: 14px; }
  main.collapsed .panel-toggle svg { transform: rotate(180deg); }

  .panel {
    background: var(--panel);
    border-left: 1px solid rgba(255,255,255,.12);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .tabs { display: flex; flex: none; border-bottom: 1px solid var(--line-soft); }
  .tab {
    all: unset;
    cursor: pointer;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 16px 8px 13px;
    font-size: 15px;
    font-weight: 500;
    color: var(--faint);
    border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--dim); background: rgba(255,255,255,.04); }
  .tab:focus-visible { outline: 2px solid var(--blue-hi); outline-offset: -3px; }
  .tab[aria-selected="true"] { color: #fff; border-bottom-color: #fff; }
  .pill {
    display: inline-grid;
    place-items: center;
    min-width: 26px;
    height: 21px;
    padding: 0 7px;
    border-radius: 999px;
    background: rgba(255,255,255,.2);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .pane {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px 14px 12px;
  }
  .pane[hidden] { display: none; }

  .toolbar { display: flex; gap: 7px; flex-wrap: wrap; flex: none; }

  .btn {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 11px;
    border-radius: 4px;
    background: var(--blue);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .btn:hover { background: var(--blue-hi); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .btn[disabled] { cursor: default; opacity: .45; box-shadow: none; }
  .btn[disabled]:hover { background: var(--blue); }
  .btn .icon { width: 19px; height: 19px; }
  .btn.plain { background: transparent; box-shadow: none; color: var(--dim); }
  .btn.plain:hover { background: rgba(255,255,255,.1); color: #fff; }

  textarea#entries {
    flex: 1;
    min-height: 160px;
    width: 100%;
    font: inherit;
    font-size: 15px;
    line-height: 1.75;
    padding: 12px 14px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.38);
    background: #0e0e0e;
    color: #fff;
    resize: none;
  }
  textarea#entries:hover { border-color: rgba(255,255,255,.6); }
  textarea#entries:focus-visible { outline: none; border-color: var(--blue-hi); box-shadow: inset 0 0 0 1px var(--blue-hi); }

  .results {
    flex: 1;
    overflow-y: auto;
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .results li {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-radius: 4px;
    background: rgba(255,255,255,.06);
    font-size: 15px;
  }
  .results li.gone { color: var(--faint); }
  .results .pos {
    flex: none;
    min-width: 22px;
    height: 22px;
    padding: 0 5px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .empty { margin: 0; font-size: 14px; color: var(--faint); }

  .panel-foot {
    flex: none;
    border-top: 1px solid var(--line-soft);
    padding: 13px 16px;
    font-size: 14px;
    color: var(--dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    white-space: nowrap;
    overflow: hidden;
  }

  /* ---------------- winner dialog ---------------- */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,.55);
    display: grid;
    place-items: center;
    padding: 24px;
    animation: fade .18s ease;
  }
  .scrim[hidden] { display: none; }

  .dialog {
    width: min(900px, 100%);
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 16px 48px rgba(0,0,0,.6);
    animation: pop .22s ease;
  }
  .dialog-head {
    background: var(--amber);
    color: #111;
    font-size: clamp(20px, 2.4vw, 27px);
    font-weight: 700;
    padding: 18px 24px;
  }
  .dialog-body {
    padding: 34px 24px 12px;
    text-align: center;
  }
  .winner-name {
    font-size: clamp(38px, 7vw, 68px);
    font-weight: 300;
    line-height: 1.15;
    letter-spacing: .5px;
    overflow-wrap: anywhere;
  }
  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 18px;
    flex-wrap: wrap;
  }
  .dialog-actions .btn.soft { background: var(--blue-soft); color: #10203c; }
  .dialog-actions .btn.soft:hover { background: #92b4f3; }

  /* ---------------- toast ---------------- */
  .toast {
    position: fixed;
    left: 24px;
    bottom: 24px;
    z-index: 30;
    background: #2f2f2f;
    color: #fff;
    font-size: 14px;
    padding: 13px 18px;
    border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
    animation: fade .18s ease;
  }
  .toast[hidden] { display: none; }

  .confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 21;
  }
  .confetti[hidden] { display: none; }

  /* ---------------- composer (long-press the title) ---------------- */
  .composer {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 25;
    width: min(620px, calc(100% - 32px));
    background: var(--surface);
    border: 1px solid var(--blue);
    border-radius: 6px;
    box-shadow: 0 16px 48px rgba(0,0,0,.6);
    padding: 18px;
  }
  .composer[hidden] { display: none; }
  .composer p { margin: 0 0 12px; font-size: 13px; line-height: 1.55; color: var(--dim); }
  .composer textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    line-height: 1.6;
    padding: 11px 13px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,.38);
    background: rgba(0,0,0,.3);
    color: #fff;
    resize: vertical;
    min-height: 130px;
  }
  .composer .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .composer .status { font-size: 13px; color: var(--dim); }
  .composer .out {
    margin-top: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    word-break: break-all;
    color: var(--blue-soft);
  }
  .composer .out:empty { display: none; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .scrim, .dialog, .toast { animation: none; }
    main, .panel-toggle, .panel-toggle svg { transition: none; }
  }

  /* ---------------- responsive ---------------- */
  @media (max-width: 1320px) {
    .navbtn span { display: none; }
    .navbtn { padding: 9px; }
  }
  @media (max-width: 900px) {
    body { overflow: auto; }
    main, main.collapsed { grid-template-columns: minmax(0, 1fr); }
    .panel { border-left: none; border-top: 1px solid var(--line-soft); min-height: 400px; }
    .panel-toggle { display: none; }
    .stage { width: min(100%, 78vw, 520px); }
    .brand span { font-size: 17px; }
  }
  @media (max-width: 560px) {
    .appbar { padding: 0 8px; gap: 4px; }
    .brand svg { width: 28px; height: 28px; }
    .stage-wrap { padding: 12px; }
    .fab { top: 10px; left: 10px; width: 40px; height: 40px; }
  }
</style>
<script>
// Surfaces a script failure instead of leaving a silently blank page.
window.addEventListener('error', e => {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;background:#c92a2a;color:#fff;' +
    'font:14px/1.45 system-ui,sans-serif;padding:10px 16px';
  bar.textContent = 'Script error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '');
  (document.body || document.documentElement).appendChild(bar);
});
</script>
</head>
<body>
<header class="appbar">
  <h1 class="brand" id="title">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 16 L16 2 A14 14 0 0 1 30 16 Z" fill="#f4c20d"/>
      <path d="M16 16 L30 16 A14 14 0 0 1 16 30 Z" fill="#3cba54"/>
      <path d="M16 16 L16 30 A14 14 0 0 1 2 16 Z" fill="#4885ed"/>
      <path d="M16 16 L2 16 A14 14 0 0 1 16 2 Z" fill="#db3236"/>
      <path d="M21.5 16 L31 10.6 L31 21.4 Z" fill="#fff"/>
      <circle cx="16" cy="16" r="5.2" fill="#fff"/>
    </svg>
    <span>Name draw</span>
  </h1>

  <span class="grow"></span>

  <nav class="navlist">
    <button class="navbtn" id="navCustomize" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M12 3.2c-4.9 0-8.8 3.6-8.8 8.1s3.9 8.1 8.8 8.1c.9 0 1.6-.7 1.6-1.6 0-.4-.15-.8-.4-1.1-.25-.3-.4-.6-.4-1 0-.9.7-1.6 1.6-1.6h1.9c2.7 0 4.9-2.1 4.9-4.7 0-3.9-3.9-6.2-9.2-6.2Z"/>
        <circle cx="7.3" cy="11.6" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="7.9" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="14.3" cy="7.9" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="17.2" cy="11.1" r="1.15" fill="currentColor" stroke="none"/>
      </svg>
      <span>Customize</span>
    </button>
    <button class="navbtn" id="navNew" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Zm0 2.4L16.6 8H14V5.4Z"/></svg>
      <span>New</span>
    </button>
    <button class="navbtn" id="navOpen" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2Z"/></svg>
      <span>Open</span>
    </button>
    <button class="navbtn" id="navSave" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4Zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm3-10H6V5h9v4Z"/></svg>
      <span>Save</span>
    </button>
    <button class="navbtn" id="navShare" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="18" cy="5" r="2.7"/><circle cx="6" cy="12" r="2.7"/><circle cx="18" cy="19" r="2.7"/>
        <path d="M8.5 10.7 15.5 6.7M8.5 13.3l7 4" stroke="currentColor" stroke-width="1.8" fill="none"/>
      </svg>
      <span>Share</span>
    </button>
    <button class="navbtn" id="navGallery" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8 21 21"/></svg>
      <span>Gallery</span>
    </button>
    <button class="navbtn icon-only" id="navFull" type="button" aria-label="Fullscreen">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>
    </button>
    <button class="navbtn" id="navMore" type="button" aria-haspopup="true" aria-expanded="false">
      <span>More</span>
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>
    </button>
    <button class="navbtn" id="navLang" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.7" ry="8.6"/><path d="M3.6 9.4h16.8M3.6 14.6h16.8"/></svg>
      <span>English</span>
    </button>
  </nav>

  <div class="menu" id="moreMenu" hidden role="menu">
    <button class="menu-item" id="menuSound" type="button" role="menuitem">Sound: on</button>
    <button class="menu-item" id="menuReset" type="button" role="menuitem">Put everyone back</button>

<section class="composer" id="composer" hidden>
  <p>One name per line, in the order they should come out. A blank line or a single dash leaves that slot genuinely random. Trailing blanks are ignored. Names must match the roster exactly, apart from case.</p>
  <textarea id="orderText" spellcheck="false" autocapitalize="words" aria-label="Draw order"></textarea>
  <div class="row">
    <button type="button" class="btn" id="makeLink">Build link</button>
    <button type="button" class="btn" id="applyNow">Apply here</button>
    <button type="button" class="btn plain" id="closeComposer">Close</button>
    <span class="status" id="composerStatus"></span>
  </div>
  <div class="out" id="linkOut"></div>

<script>
(() => {
  'use strict';

  const __boot = () => {

  const TAU = Math.PI * 2;
  const PALETTE   = ['#db3236', '#f4c20d', '#3cba54', '#4885ed'];
  const LABEL_INK = ['#ffffff', '#1a1a1a', '#1a1a1a', '#ffffff'];
  const STORE_KEY = 'namedraw.entries';

  const state = {
    names: [],      // {id, name} in list order; duplicates allowed
    removed: [],    // ids taken off the wheel
    results: [],    // ids in the order they were spun
    wheel: [],      // ids currently on the wheel (derived from names + removed)
    rotation: 0,
    spinning: false,
    sound: true,
    hasSpun: false,   // the click-to-spin prompt only rides an untouched wheel
  };

  let nextId = 1;
  let colors = [];

  const $ = id => document.getElementById(id);
  const canvas = $('wheel');
  const ctx = canvas.getContext('2d');
  const nameOf = id => (state.names.find(p => p.id === id) || {}).name || '';

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- draw order ----------
     A list of names, one per draw. null means "let this one be random".
     Arrives base64url-encoded in ?c= and is wiped from the address bar
     as soon as it is read. Nothing is stored on disk. */

  let order = [];

  function b64encode(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function b64decode(b64) {
    const pad = b64.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(pad + '='.repeat((4 - pad.length % 4) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  /* Reads both params, then strips only ?c= so a shared ?w= link survives. */
  function loadFromUrl() {
    const q = new URLSearchParams(location.search);
    let shared = null;

    try {
      const raw = q.get('c');
      if (raw) {
        const parsed = JSON.parse(b64decode(raw));
        if (Array.isArray(parsed)) order = parsed;
      }
    } catch (e) { order = []; }

    try {
      const w = q.get('w');
      if (w) {
        const parsed = JSON.parse(b64decode(w));
        if (Array.isArray(parsed)) shared = parsed.filter(x => typeof x === 'string');
      }
    } catch (e) { shared = null; }

    if (q.has('c')) {
      q.delete('c');
      const rest = q.toString();
      try { history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '')); } catch (e) {}
    }
    return shared;
  }

  /* The one place a winner is chosen. Falls through to real randomness
     whenever the slot is empty or the named entry is already off the wheel. */
  function pickIndex(n) {
    const want = order[state.results.length];
    if (want) {
      const target = String(want).trim().toLowerCase();
      const i = state.wheel.findIndex(id => nameOf(id).trim().toLowerCase() === target);
      if (i !== -1) return i;
    }
    return Math.floor(Math.random() * n);
  }

  /* ---------- roster ----------
     The textarea is the roster: one entry per line, duplicates allowed
     (a name listed twice simply gets two slices). Re-reading it hands the
     same ids back to unchanged lines, so results and removals survive edits. */

  function readEntries(raw) {
    const lines = raw.split('\n').map(s => s.trim()).filter(Boolean).map(s => s.slice(0, 32));

    const pool = new Map();
    for (const p of state.names) {
      const k = p.name.toLowerCase();
      if (!pool.has(k)) pool.set(k, []);
      pool.get(k).push(p.id);
    }

    const names = lines.map(name => {
      const q = pool.get(name.toLowerCase());
      return { id: (q && q.length) ? q.shift() : nextId++, name };
    });

    const live = new Set(names.map(p => p.id));
    state.names = names;
    state.removed = state.removed.filter(id => live.has(id));
    state.results = state.results.filter(id => live.has(id));

    rebuildWheel();
    renderAll();
  }

  /* The wheel is the entry list in order, minus anyone taken off it. */
  function rebuildWheel() {
    const gone = new Set(state.removed);
    state.wheel = state.names.filter(p => !gone.has(p.id)).map(p => p.id);
    assignColors();
  }

  function entriesText() {
    return state.names.map(p => p.name).join('\n');
  }

  function syncTextarea() {
    const ta = $('entries');
    if (document.activeElement === ta) return;   // never fight the cursor
    const text = entriesText();
    if (ta.value !== text) ta.value = text;
  }

  /* Cycle the four colors, avoiding a seam where the last wedge touches
     the first with the same fill. */
  function assignColors() {
    const n = state.wheel.length;
    const k = PALETTE.length;
    colors = Array.from({ length: n }, (_, i) => i % k);
    if (n > 2 && colors[n - 1] === colors[0]) {
      for (let c = 0; c < k; c++) {
        if (c !== colors[n - 2] && c !== colors[0]) { colors[n - 1] = c; break; }
      }
    }
  }

  /* ---------- canvas ---------- */

  /* The pointer wears the colour of whatever wedge sits under it, so it reads
     as part of the wheel rather than as a fixed marker. */
  const pointerEl = $('pointer');
  let pointerPaint = null;

  function shade(hex, amt) {
    const v = parseInt(hex.slice(1), 16);
    let r = (v >> 16) & 255, g = (v >> 8) & 255, b = v & 255;
    if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
    else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
    return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
  }

  function paintPointer(hex) {
    if (hex === pointerPaint) return;
    pointerPaint = hex;
    pointerEl.style.background =
      `linear-gradient(158deg, ${shade(hex, .42)} 0%, ${hex} 44%, ${shade(hex, -.45)} 100%)`;
  }

  function sizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  /* Past this many entries a wedge is thinner than the pointer, so the pointer
     stops borrowing wedge colour: it would strobe rather than read as a marker. */
  const CROWDED = 60;

  /* The disc is rendered once into an offscreen canvas and then drawn rotated.
     A 300-name wheel then costs one drawImage a frame instead of 300 wedges
     and 300 labels, which is what used to starve the tick sound of time. */
  let sprite = null;
  let spriteHalf = 0;
  let spriteKey = '';

  /* Trims a label to an ellipsis rather than shrinking the whole wheel's type
     down to fit the single longest entry. */
  function fitLabel(g, text, max) {
    if (g.measureText(text).width <= max) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (g.measureText(text.slice(0, mid) + '…').width <= max) lo = mid; else hi = mid - 1;
    }
    return lo ? text.slice(0, lo) + '…' : '';
  }

  function buildSprite(r, dpr) {
    const n = state.wheel.length;
    const pad = Math.max(3, r * 0.01);           // room for the rim stroke
    const half = r + pad;
    sprite = sprite || document.createElement('canvas');
    sprite.width = Math.round(half * 2 * dpr);
    sprite.height = Math.round(half * 2 * dpr);
    const g = sprite.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, half * 2, half * 2);

    const cx = half, cy = half;
    const seg = TAU / n;

    // Wedges first, meeting edge to edge with no divider between them.
    for (let i = 0; i < n; i++) {
      const a0 = i * seg;                          // pointer sits at 3 o'clock
      const ci = colors[i] ?? (i % PALETTE.length);
      g.beginPath();
      g.moveTo(cx, cy);
      g.arc(cx, cy, r, a0, a0 + seg + 0.004);      // hairline overlap kills seams
      g.closePath();
      g.fillStyle = PALETTE[ci];
      g.fill();
    }

    // A soft sheen near the middle and a darker rim give the disc some depth.
    const sheen = g.createRadialGradient(cx, cy, r * 0.12, cx, cy, r);
    sheen.addColorStop(0,    'rgba(255,255,255,.035)');
    sheen.addColorStop(0.55, 'rgba(255,255,255,0)');
    sheen.addColorStop(0.92, 'rgba(0,0,0,.02)');
    sheen.addColorStop(1,    'rgba(0,0,0,.09)');
    g.beginPath();
    g.arc(cx, cy, r, 0, TAU);
    g.fillStyle = sheen;
    g.fill();

    // Labels last so the shading never dulls them. Each one reads outward from
    // the hub, the way the reference wheel sets its text.
    const maxW = r * 0.72;                         // radial room a label may use
    // Labels ride against the rim, so the type is sized by the wedge's
    // tangential thickness out there rather than at mid-radius.
    let fontSize = Math.min(r * 0.78 * seg * 0.82, r * 0.26);
    // A crowded wheel keeps its names: hold a floor and clip long entries
    // instead of shrinking every label away to nothing.
    const minFont = Math.min(r * 0.26, Math.max(6, r * 0.018));
    fontSize = Math.max(fontSize, minFont);

    const font = px => `600 ${px}px Quicksand, Roboto, system-ui, sans-serif`;
    g.font = font(fontSize);
    let widest = 0;
    for (const id of state.wheel) {
      const wLab = g.measureText(nameOf(id)).width;
      if (wLab > widest) widest = wLab;
    }
    if (widest > maxW) fontSize = Math.max(minFont, fontSize * maxW / widest);

    // Below a couple of pixels of wedge at the rim the type is only noise.
    if (r * seg >= 2) {
      g.font = font(fontSize);
      g.textAlign = 'right';
      g.textBaseline = 'middle';
      for (let i = 0; i < n; i++) {
        const ci = colors[i] ?? (i % PALETTE.length);
        g.save();
        g.translate(cx, cy);
        g.rotate(i * seg + seg / 2);
        g.fillStyle = LABEL_INK[ci];
        g.fillText(fitLabel(g, nameOf(state.wheel[i]), maxW), r - fontSize * 0.42, 0);
        g.restore();
      }
    }

    // thin dark edge, the way the wedges meet the rim
    g.beginPath();
    g.arc(cx, cy, r, 0, TAU);
    g.strokeStyle = 'rgba(0,0,0,.45)';
    g.lineWidth = Math.max(1.5, r * 0.008);
    g.stroke();

    return half;
  }

  /* Text bent along a circle, for the prompt that sits on an unspun wheel.
     Same face as the entry labels, white, over the soft drop shadow the
     reference wheel carries rather than an outline. */
  function arcText(text, cx, cy, radius, midAngle, size, flip) {
    ctx.save();
    ctx.font = `700 ${size}px Quicksand, Roboto, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,.5)';
    ctx.shadowBlur = size * 0.28;
    const drop = size * 0.09;
    const chars = [...text];
    const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0);
    const dir = flip ? -1 : 1;                     // the lower line reads the other way round
    let a = midAngle - dir * (total / radius) / 2;
    for (let i = 0; i < chars.length; i++) {
      const step = widths[i] / radius;
      const spin = a + dir * step / 2 + (flip ? Math.PI : 0);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(a + dir * step / 2);
      ctx.translate(0, -radius);
      if (flip) ctx.rotate(Math.PI);
      // Chrome turns the shadow offset with the glyph, so the glyph's own
      // rotation is undone here and every shadow falls straight down.
      ctx.shadowOffsetX = drop * Math.sin(spin);
      ctx.shadowOffsetY = drop * Math.cos(spin);
      ctx.fillText(chars[i], 0, 0);
      ctx.restore();
      a += dir * step;
    }
    ctx.restore();
  }

  /* Shown until the first spin of the session, the way the reference wheel does. */
  function drawHint(cx, cy, r) {
    arcText('Click to spin', cx, cy, r * 0.60, 0, Math.min(r * 0.135, 46), false);
    arcText('or press ctrl+enter', cx, cy, r * 0.62, Math.PI, Math.min(r * 0.105, 36), true);
  }

  function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const cx = w / 2, cy = h / 2;
    const size = Math.min(w, h);
    const r = size / 2 - size * 0.035;
    const n = state.wheel.length;

    ctx.clearRect(0, 0, w, h);

    // the wheel sits on a soft drop shadow
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, TAU);
    ctx.fillStyle = n === 0 ? 'rgba(255,255,255,.04)' : '#111';
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = size * 0.045;
    ctx.shadowOffsetY = size * 0.012;
    ctx.fill();
    ctx.restore();

    if (n === 0) {
      paintPointer('#e9e9ea');
      ctx.beginPath();
      ctx.arc(cx, cy, r - 2, 0, TAU);
      ctx.strokeStyle = 'rgba(255,255,255,.28)';
      ctx.lineWidth = 2;
      ctx.setLineDash([9, 11]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.font = '400 16px Roboto, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(state.names.length ? 'Everyone has been removed' : 'Add names in the panel', cx, cy + r * 0.42);
      return;
    }

    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const key = Math.round(r) + '|' + dpr + '|' + state.wheel.join(',') + '|' + state.wheel.map(nameOf).join('\n');
    if (key !== spriteKey) {
      spriteHalf = buildSprite(r, dpr);
      spriteKey = key;
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(state.rotation);
    ctx.drawImage(sprite, -spriteHalf, -spriteHalf, spriteHalf * 2, spriteHalf * 2);
    ctx.restore();

    // On a crowded wheel the wedge under the pointer changes several times a
    // frame, so the colour only strobes: the pointer stays neutral instead.
    paintPointer(n > CROWDED ? '#e9e9ea' : PALETTE[colors[wedgeUnderPointer()] ?? 0]);

    if (!state.hasSpun && !state.spinning) drawHint(cx, cy, r);
  }

  /* ---------- sound ---------- */

  let audio = null;
  // A 300-wedge wheel crosses dozens of wedges a frame; without a ceiling the
  // clicks pile into each other and the sound turns to mush.
  const TICK_MIN_MS = 45;
  let lastTickAt = 0;

  function tick() {
    if (!state.sound || !audio) return;
    const now = performance.now();
    if (now - lastTickAt < TICK_MIN_MS) return;
    lastTickAt = now;
    const t = audio.currentTime;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'square';
    osc.frequency.value = 880 + Math.random() * 220;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.05, t + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + 0.06);
  }

  function wakeAudio() {
    if (!state.sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
  }

  /* ---------- spin ---------- */

  function wedgeUnderPointer() {
    const n = state.wheel.length;
    const seg = TAU / n;
    const a = ((-state.rotation % TAU) + TAU) % TAU;
    return Math.min(n - 1, Math.floor(a / seg));
  }

  let idleRaf = null;
  let idleLastFrame = 0;

  function startIdle() {
    if (idleRaf || reduceMotion) return;
    if (state.spinning || state.wheel.length < 2) return;
    idleLastFrame = performance.now();
    const step = (now) => {
      if (state.spinning || state.wheel.length < 2) { idleRaf = null; return; }
      const dt = Math.min(50, now - idleLastFrame) / 1000;
      idleLastFrame = now;
      state.rotation = (state.rotation + dt * 0.1) % TAU;
      draw();
      idleRaf = requestAnimationFrame(step);
    };
    idleRaf = requestAnimationFrame(step);
  }

  function stopIdle() {
    if (idleRaf) cancelAnimationFrame(idleRaf);
    idleRaf = null;
  }

  function spin() {
    if (state.spinning || state.wheel.length === 0) return;
    stopIdle();
    wakeAudio();
    state.spinning = true;
    state.hasSpun = true;
    setControls();

    const n = state.wheel.length;
    const seg = TAU / n;

    const index = pickIndex(n);
    const offset = 0.15 + Math.random() * 0.7;   // land inside the wedge, not dead centre

    let target = -(index + offset) * seg;
    target = ((target % TAU) + TAU) % TAU;
    const turns = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 4);
    while (target < state.rotation + turns * TAU) target += TAU;

    const start = state.rotation;
    const dur = reduceMotion ? 700 : 4200 + Math.random() * 2000;
    const t0 = performance.now();
    let lastWedge = wedgeUnderPointer();

    function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - t, 4);
      state.rotation = start + (target - start) * eased;

      const w = wedgeUnderPointer();
      if (w !== lastWedge) { tick(); lastWedge = w; }

      draw();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        state.rotation %= TAU;
        settle(index);
      }
    }
    requestAnimationFrame(frame);
  }

  function settle(index) {
    const id = state.wheel[index];
    state.results.push(id);
    state.spinning = false;
    renderAll();
    $('live').textContent = 'Winner: ' + nameOf(id);
    showWinner(id);
  }

  function undo() {
    const id = state.results.pop();
    if (id === undefined) return;
    state.removed = state.removed.filter(x => x !== id);
    rebuildWheel();
    renderAll();
    toast(nameOf(id) + ' is back on the wheel.');
  }

  function resetWheel() {
    state.results = [];
    state.removed = [];
    state.rotation = 0;
    rebuildWheel();
    renderAll();
    toast('Everyone is back on the wheel.');
  }

  /* ---------- rendering ---------- */

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderAll() {
    syncTextarea();

    const gone = new Set(state.removed);
    $('drawnList').innerHTML = state.results
      .map((id, i) =>
        '<li class="' + (gone.has(id) ? 'gone' : '') + '"><span class="pos">' + (i + 1) + '</span>' +
        escapeHtml(nameOf(id)) + '</li>')
      .reverse()
      .join('');
    $('resultsEmpty').hidden = state.results.length > 0;

    $('entriesCount').textContent = state.names.length;
    $('resultsCount').textContent = state.results.length;

    setControls();
    draw();
    startIdle();
  }

  function setControls() {
    const idle = !state.spinning && state.wheel.length > 0;
    $('hub').disabled = !idle;
    canvas.classList.toggle('busy', !idle);

    $('entries').readOnly = state.spinning;
    $('shuffleBtn').disabled = state.spinning;
    $('sortBtn').disabled = state.spinning;
    $('undoBtn').disabled = state.spinning || state.results.length === 0;
    $('resetBtn').disabled = state.spinning || (state.results.length === 0 && state.removed.length === 0);
  }

  function showTab(which) {
    const entries = which === 'entries';
    $('tabEntries').setAttribute('aria-selected', String(entries));
    $('tabResults').setAttribute('aria-selected', String(!entries));
    $('paneEntries').hidden = !entries;
    $('paneResults').hidden = entries;
  }

  let toastTimer = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  /* ---------- wiring: entries ---------- */

  $('entries').addEventListener('input', e => readEntries(e.target.value));
  $('entries').addEventListener('blur', syncTextarea);

  function reorder(fn) {
    fn(state.names);
    $('entries').blur();
    rebuildWheel();
    renderAll();
  }

  $('shuffleBtn').addEventListener('click', () => reorder(list => {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
  }));

  $('sortBtn').addEventListener('click', () => reorder(list => {
    list.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
  }));

  $('hub').addEventListener('click', spin);
  canvas.addEventListener('click', spin);

  $('undoBtn').addEventListener('click', undo);
  $('resetBtn').addEventListener('click', resetWheel);

  $('tabEntries').addEventListener('click', () => showTab('entries'));
  $('tabResults').addEventListener('click', () => showTab('results'));

  $('editFab').addEventListener('click', () => {
    $('main').classList.remove('collapsed');
    $('panelToggle').setAttribute('aria-expanded', 'true');
    showTab('entries');
    $('entries').focus();
  });

  $('panelToggle').addEventListener('click', () => {
    const m = $('main');
    const collapsed = m.classList.toggle('collapsed');
    const btn = $('panelToggle');
    btn.setAttribute('aria-expanded', String(!collapsed));
    btn.setAttribute('aria-label', collapsed ? 'Show the entries panel' : 'Hide the entries panel');
    requestAnimationFrame(sizeCanvas);
  });

  /* ---------- wiring: app bar ---------- */

  $('navNew').addEventListener('click', () => {
    state.names = [];
    state.removed = [];
    state.results = [];
    state.rotation = 0;
    rebuildWheel();
    $('entries').value = '';
    renderAll();
    showTab('entries');
    $('entries').focus();
    toast('New wheel.');
  });

  $('navSave').addEventListener('click', () => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state.names.map(p => p.name)));
      toast('Wheel saved in this browser.');
    } catch (e) {
      toast('This browser would not let the wheel be saved.');
    }
  });

  $('navOpen').addEventListener('click', () => {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
    if (!Array.isArray(saved) || !saved.length) {
      toast('Nothing saved in this browser yet.');
      return;
    }
    state.removed = [];
    state.results = [];
    state.names = [];
    readEntries(saved.join('\n'));
    showTab('entries');
    toast('Loaded the saved wheel.');
  });

  $('navShare').addEventListener('click', () => {
    if (!state.names.length) { toast('Add some names first.'); return; }
    const url = location.origin + location.pathname +
      '?w=' + b64encode(JSON.stringify(state.names.map(p => p.name)));
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url)
        .then(() => toast('Link copied — it carries these entries.'))
        .catch(() => toast('Copy this: ' + url));
    } else {
      toast('Copy this: ' + url);
    }
  });

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  $('navFull').addEventListener('click', toggleFullscreen);

  /* The More menu is where the controls that have no button of their own live. */
  function closeMenu() {
    $('moreMenu').hidden = true;
    $('navMore').setAttribute('aria-expanded', 'false');
  }

  $('navMore').addEventListener('click', e => {
    e.stopPropagation();
    const menu = $('moreMenu');
    const open = menu.hidden;
    menu.hidden = !open;
    $('navMore').setAttribute('aria-expanded', String(open));
    if (open) {
      const r = $('navMore').getBoundingClientRect();
      menu.style.left = Math.max(8, Math.min(r.left, innerWidth - 226)) + 'px';
    }
  });

  document.addEventListener('click', e => {
    if (!$('moreMenu').hidden && !$('moreMenu').contains(e.target)) closeMenu();
  });

  $('menuSound').addEventListener('click', () => {
    state.sound = !state.sound;
    $('menuSound').textContent = 'Sound: ' + (state.sound ? 'on' : 'off');
    if (state.sound) wakeAudio();
    closeMenu();
  });

  $('menuReset').addEventListener('click', () => { resetWheel(); closeMenu(); });
  $('menuFull').addEventListener('click', () => { toggleFullscreen(); closeMenu(); });

  /* Present for the sake of the layout; nothing behind them in this build. */
  const decorative = {
    navCustomize: 'Customize is not part of this build.',
    navGallery:   'Gallery is not part of this build.',
    navLang:      'This build is English only.',
    addImageBtn:  'Image entries are not part of this build.',
    addWheelBtn:  'This build holds a single wheel.',
    changelog:    'No changelog in this build.',
  };
  for (const [id, msg] of Object.entries(decorative)) {
    $(id).addEventListener('click', () => toast(msg));
  }

  /* ---------- winner dialog ---------- */

  let winnerId = null;

  function showWinner(id) {
    winnerId = id;
    $('winnerName').textContent = nameOf(id);
    const dupes = state.names.filter(p => p.name.toLowerCase() === nameOf(id).toLowerCase()).length;
    $('winRemoveAll').hidden = dupes < 2;
    // With nothing to disambiguate, Remove is the primary action.
    $('winRemove').classList.toggle('soft', dupes >= 2);
    $('winner').hidden = false;
    fireConfetti();
    setTimeout(() => $('winRemove').focus(), 20);
  }

  function closeWinner() {
    $('winner').hidden = true;
    winnerId = null;
    $('hub').focus();
  }

  $('winClose').addEventListener('click', closeWinner);

  $('winRemove').addEventListener('click', () => {
    if (winnerId !== null && !state.removed.includes(winnerId)) state.removed.push(winnerId);
    rebuildWheel();
    renderAll();
    closeWinner();
  });

  $('winRemoveAll').addEventListener('click', () => {
    if (winnerId !== null) {
      const target = nameOf(winnerId).toLowerCase();
      for (const p of state.names) {
        if (p.name.toLowerCase() === target && !state.removed.includes(p.id)) state.removed.push(p.id);
      }
    }
    rebuildWheel();
    renderAll();
    closeWinner();
  });

  $('winner').addEventListener('click', e => { if (e.target === $('winner')) closeWinner(); });

  /* ctrl/cmd+enter spins, the shortcut the prompt on the wheel advertises. */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
    if (!$('winner').hidden || !$('composer').hidden || !$('moreMenu').hidden) return;
    e.preventDefault();
    spin();
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('moreMenu').hidden) closeMenu();
    else if (!$('winner').hidden) closeWinner();
    else if (!$('composer').hidden) $('composer').hidden = true;
  });

  /* ---------- confetti ---------- */

  const confettiCanvas = $('confetti');
  const cctx = confettiCanvas.getContext('2d');
  const CONFETTI_COLORS = PALETTE.concat(['#ffffff']);
  let confetti = [];
  let confettiRaf = null;

  function sizeConfetti() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    confettiCanvas.width = Math.round(innerWidth * dpr);
    confettiCanvas.height = Math.round(innerHeight * dpr);
    confettiCanvas.style.width = innerWidth + 'px';
    confettiCanvas.style.height = innerHeight + 'px';
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawnBurst(originX, originY, angle) {
    for (let i = 0; i < 90; i++) {
      const a = angle + (Math.random() - 0.5) * 0.7;
      const speed = 11 + Math.random() * 14;
      confetti.push({
        x: originX, y: originY,
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        size: 6 + Math.random() * 7,
        rot: Math.random() * TAU,
        vrot: (Math.random() - 0.5) * 0.4,
        color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
        oval: Math.random() < 0.3,
      });
    }
  }

  function stepConfetti() {
    const w = innerWidth, h = innerHeight;
    cctx.clearRect(0, 0, w, h);
    const gravity = 0.32, drag = 0.992;

    confetti = confetti.filter(p => {
      p.vx *= drag;
      p.vy = p.vy * drag + gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      if (p.y > h + 60 || p.x < -60 || p.x > w + 60) return false;

      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      if (p.oval) {
        cctx.beginPath();
        cctx.ellipse(0, 0, p.size * 0.55, p.size * 0.3, 0, 0, TAU);
        cctx.fill();
      } else {
        cctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.55);
      }
      cctx.restore();
      return true;
    });

    if (confetti.length > 0) {
      confettiRaf = requestAnimationFrame(stepConfetti);
    } else {
      cctx.clearRect(0, 0, w, h);
      confettiCanvas.hidden = true;
      confettiRaf = null;
    }
  }

  function fireConfetti() {
    if (reduceMotion) return;
    sizeConfetti();
    confettiCanvas.hidden = false;
    const h = innerHeight;
    spawnBurst(0, h, -Math.PI / 3);
    spawnBurst(innerWidth, h, -2 * Math.PI / 3);
    setTimeout(() => {
      spawnBurst(innerWidth * 0.15, h, -Math.PI / 2.6);
      spawnBurst(innerWidth * 0.85, h, -Math.PI + Math.PI / 2.6);
    }, 220);
    if (!confettiRaf) confettiRaf = requestAnimationFrame(stepConfetti);
  }

  addEventListener('resize', () => { if (!confettiCanvas.hidden) sizeConfetti(); });

  /* ---------- composer ---------- */

  function parseOrder(text) {
    const rows = text.split('\n').map(s => s.trim());
    const arr = rows.map(s => (!s || s === '-') ? null : s);
    while (arr.length && arr[arr.length - 1] === null) arr.pop();
    return arr;
  }

  function describe(arr) {
    const set = arr.filter(Boolean).length;
    if (!arr.length) return 'Cleared. Every spin is random.';
    return set + ' of ' + arr.length + ' slots set, rest random.';
  }

  function openComposer() {
    const c = $('composer');
    c.hidden = !c.hidden;
    if (!c.hidden) {
      $('orderText').value = order.map(x => x || '-').join('\n');
      $('composerStatus').textContent = describe(order);
      $('orderText').focus();
    }
  }

  $('makeLink').addEventListener('click', () => {
    const arr = parseOrder($('orderText').value);
    const url = location.origin + location.pathname + '?c=' + b64encode(JSON.stringify(arr));
    $('linkOut').textContent = url;
    $('composerStatus').textContent = describe(arr);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url)
        .then(() => { $('composerStatus').textContent = describe(arr) + ' Link copied.'; })
        .catch(() => {});
    }
  });

  $('applyNow').addEventListener('click', () => {
    order = parseOrder($('orderText').value);
    $('composerStatus').textContent = describe(order) + ' Active.';
    $('linkOut').textContent = '';
  });

  $('closeComposer').addEventListener('click', () => { $('composer').hidden = true; });

  // Long-press the title for 1.2s to reveal the composer.
  let pressTimer = null;
  const title = $('title');
  const startPress = () => { pressTimer = setTimeout(openComposer, 1200); };
  const endPress = () => { clearTimeout(pressTimer); pressTimer = null; };
  title.addEventListener('pointerdown', startPress);
  title.addEventListener('pointerup', endPress);
  title.addEventListener('pointerleave', endPress);
  title.addEventListener('pointercancel', endPress);
  title.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- boot ---------- */

  const shared = loadFromUrl();
  new ResizeObserver(sizeCanvas).observe(canvas);
  // The first paint can land in the fallback face, so the disc is rebuilt once
  // Quicksand is actually there rather than repainted from the stale sprite.
  document.fonts && document.fonts.ready.then(() => { spriteKey = ''; draw(); });
  sizeCanvas();
  if (shared && shared.length) readEntries(shared.join('\n'));
  // A reload leaves Chrome's restored text in the box without firing `input`,
  // so read whatever is sitting there rather than starting out of step with it.
  else if ($('entries').value.trim()) readEntries($('entries').value);
  else renderAll();

  };
  // A script at the end of <body> still runs before DOMContentLoaded fires,
  // so this stays correct however the page is served or injected into.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', __boot);
  else __boot();
})();
</script>
</body>
</html>
